name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format --check src tests migrations
      - run: uv run ruff check src tests migrations
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    # Builds the release archive on every push to main. When the repository variable
    # DEPLOY_ENABLED is "true", it also installs the release on the server over SSH.
    # Setup: docs/部署指南.md, section "自动部署".
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEMO_MODE: ${{ vars.ERF_DEMO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build release archive
        run: |
          if [ "$DEMO_MODE" = "true" ]; then bash deploy/scripts/build-release.sh --demo; else bash deploy/scripts/build-release.sh; fi
          echo "ARCHIVE=$(ls release/*.tar.gz)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: erf-release
          path: release/*.tar.gz
          retention-days: 30

      - name: Configure SSH
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Install the release on the server
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DOMAIN: ${{ vars.ERF_DOMAIN }}
          SMTP_USER: ${{ vars.ERF_SMTP_USERNAME || secrets.ERF_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.ERF_SMTP_PASSWORD }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes"
          NAME="$(basename "$ARCHIVE")"
          scp $SSH_OPTS "$ARCHIVE" "$DEPLOY_USER@$HOST:/tmp/$NAME"

          # Email settings travel in a private file that install.sh merges into /etc/erf/erf.env and
          # deletes. Without the ERF_SMTP_PASSWORD secret, the server keeps its current email settings.
          # In demo mode every email goes to the sender's own mailbox, because demo accounts are fake.
          MAIL_FILE=""
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "Email settings: not changed on the server."
            if [ -z "$SMTP_USER" ]; then echo "  ERF_SMTP_USERNAME is empty (set it as a repository variable or secret)."; fi
            if [ -z "$SMTP_PASSWORD" ]; then echo "  ERF_SMTP_PASSWORD is empty (set it as a repository secret)."; fi
          else
            echo "Email settings: sending as $SMTP_USER (demo redirect: $DEMO_MODE)."
          fi
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ]; then
            REDIRECT=""
            if [ "$DEMO_MODE" = "true" ]; then REDIRECT="$SMTP_USER"; fi
            ( umask 077
              printf '%s\n' \
                "ERF_MAIL_BACKEND=smtp" \
                "ERF_SMTP_HOST=smtp.gmail.com" \
                "ERF_SMTP_PORT=587" \
                "ERF_SMTP_USERNAME=$SMTP_USER" \
                "ERF_SMTP_PASSWORD=${SMTP_PASSWORD// /}" \
                "ERF_MAIL_FROM=Engineering Resource Requests <$SMTP_USER>" \
                "ERF_MAIL_REDIRECT_TO=$REDIRECT" > erf-mail.env )
            scp -p $SSH_OPTS erf-mail.env "$DEPLOY_USER@$HOST:/tmp/erf-mail.env"
            MAIL_FILE=/tmp/erf-mail.env
          fi

          ssh $SSH_OPTS "$DEPLOY_USER@$HOST" bash -s -- "$NAME" "$DOMAIN" "$DEMO_MODE" "$MAIL_FILE" <<'REMOTE'
          set -euo pipefail
          NAME="$1"; DOMAIN="$2"; DEMO="$3"; MAIL_FILE="${4:-}"
          WORK="$(mktemp -d)"
          tar -xzf "/tmp/$NAME" -C "$WORK"
          if [ -n "$MAIL_FILE" ]; then
            sudo bash "$WORK/deploy/scripts/install.sh" --domain "$DOMAIN" --mail-env "$MAIL_FILE"
          else
            sudo bash "$WORK/deploy/scripts/install.sh" --domain "$DOMAIN"
          fi
          if [ "$DEMO" = "true" ]; then
            sudo bash "$WORK/deploy/scripts/release.sh" "/tmp/$NAME" --seed-demo
          else
            sudo bash "$WORK/deploy/scripts/release.sh" "/tmp/$NAME"
          fi
          rm -rf "$WORK" "/tmp/$NAME"
          REMOTE
      - name: Check the public site
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          DOMAIN: ${{ vars.ERF_DOMAIN }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://$DOMAIN/api/health"; then echo; exit 0; fi
            sleep 3
          done
          echo "https://$DOMAIN/api/health did not respond." >&2
          exit 1
