<style>
/* Layout: internal workflow tool. Fixed left rail for navigation, top bar with role switcher, content column of panels. */

}
@media (prefers-color-scheme: dark) {

  }
}
:root[data-theme="dark"] {
  --bg: #0F141B; --surface: #161D27; --surface-2: #1C2531; --fg: #E4E9F0; --muted: #96A2B4; --line: #2A3442;

}

/* form */
.form { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.fieldset { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > label, .field > .lbl { font-weight: 500; font-size: 13px; }
.req { color: var(--bad); }
.hint { font-size: 12px; color: var(--muted); }
.field input[type=text], .field input[type=number], .field input[type=date], .field select, .field textarea, .action textarea { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; background: var(--surface); width: 100%; }
.field textarea, .action textarea { min-height: 92px; resize: vertical; }

.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 16px; }
.notice { border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); background: var(--surface); }
.notice .big { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.notice.is-urgent { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); background: color-mix(in srgb, var(--bad) 7%, var(--surface)); }
.notice.is-urgent .big { color: var(--bad); }
.notice.is-normal .big { color: var(--ok); }
.cal-days { display: flex; flex-wrap: wrap; gap: 3px; }
.cal-days i { width: 14px; height: 14px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }
.cal-days i.w { background: color-mix(in srgb, var(--ok) 55%, transparent); border-color: transparent; }
.cal-days i.h { background: color-mix(in srgb, var(--warn) 55%, transparent); border-color: transparent; }
.route { display: flex; flex-direction: column; gap: 8px; }
.route-step { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.route-step .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; background: var(--surface-2); border: 1px solid var(--line); }

.form-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; grid-column: 1 / -1; }
/* detail */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.dl { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 10px 16px; margin: 0; }
.dl dt { color: var(--muted); font-size: 13px; }
.dl dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.stepper { display: flex; flex-direction: column; gap: 0; }
.step { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; padding-bottom: 14px; position: relative; }

.step.done .mk { background: var(--ok); border-color: var(--ok); color: var(--surface); }

.step .t { font-weight: 500; }
.step .w { font-size: 12px; color: var(--muted); }
.timeline { display: flex; flex-direction: column; gap: 12px; }
.ev { display: flex; flex-direction: column; gap: 2px; padding-left: 12px; border-left: 2px solid var(--line); }
.ev .meta { font-size: 12px; color: var(--muted); }

.action { border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); }
.alloc { display: flex; flex-direction: column; gap: 6px; }
.alloc label { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; }
.alloc label:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.load { font-family: var(--font-mono); font-size: 11.5px; white-space: nowrap; }

.tag { font-size: 11px; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); padding: 0 6px; border-radius: 4px; margin-left: 6px; }
.confirm-box { border: 1px dashed var(--bad); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
/* load grid */
.heat td.c { text-align: center; font-family: var(--font-mono); font-size: 12px; min-width: 64px; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid var(--line); }
/* bars */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 130px minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 14px; background: var(--surface-2); border-radius: 3px; overflow: hidden; display: flex; }
.bar .fill { height: 100%; background: var(--accent); }
.bar .fill.u { background: var(--bad); }
.bar .v { font-family: var(--font-mono); font-size: 12px; text-align: right; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; font-size: 13px; }
.kv span:nth-child(even) { font-family: var(--font-mono); text-align: right; }
.toast { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: var(--r); max-width: min(420px, calc(100vw - 40px)); font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: 20; }
.toast b { display: block; margin-bottom: 2px; }
.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r); }
@media (max-width: 1020px) {
  .form, .detail { grid-template-columns: minmax(0, 1fr); }

}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<script>
(function () {
  'use strict';

  // ---------- Reference data (sample) ----------
  const TODAY = '2026-11-05';
  const MIN_NOTICE = 5;
  const HOLIDAYS = { '2026-11-09': 'Deepavali (observed)', '2026-12-25': 'Christmas Day', '2027-01-01': "New Year's Day", '2027-02-17': 'Chinese New Year', '2027-02-18': 'Chinese New Year (day 2)' };
  const USERS = {
    pm1: { name: 'Alex Tan', title: 'Project Manager', role: 'PM' },
    pm2: { name: 'Serene Koh', title: 'Project Manager', role: 'PM' },
    tlS: { name: 'Priya Nair', title: 'Team Leader, Support', role: 'TL', team: 'SUPPORT' },
    tlD: { name: 'Daniel Lim', title: 'Team Leader, Development', role: 'TL', team: 'DEV' },
    dir: { name: 'Grace Wong', title: 'Director, Engineering', role: 'DIRECTOR' },
    adm: { name: 'Lee Wei Jie', title: 'System Administrator', role: 'ADMIN' }
  };
  const PERSONAS = ['pm1', 'tlS', 'tlD', 'dir', 'adm'];
  const TEAMS = { SUPPORT: { name: 'Support Team', leader: 'tlS' }, DEV: { name: 'Development Team', leader: 'tlD' } };
  const DIRECTOR = 'dir';
  const ENGINEERS = [
    { id: 'e1', name: 'Ahmad Rahman', team: 'SUPPORT', skill: 'Network, on-site' },
    { id: 'e2', name: 'Chua Mei Ling', team: 'SUPPORT', skill: 'Data migration' },
    { id: 'e3', name: 'Kevin Ong', team: 'SUPPORT', skill: 'Server, storage' },
    { id: 'e4', name: 'Nurul Huda', team: 'SUPPORT', skill: 'Service desk' },
    { id: 'e5', name: 'Ravi Kumar', team: 'DEV', skill: 'Java, integration' },
    { id: 'e6', name: 'Jason Teo', team: 'DEV', skill: '.NET, web portal' },
    { id: 'e7', name: 'Siti Aminah', team: 'DEV', skill: 'Solution design' },
    { id: 'e8', name: 'Marcus Lee', team: 'DEV', skill: 'Python, ETL' }
  ];
  const SUPPORT_TYPES = [
    { code: 'PE', name: 'Project Engineer', team: 'SUPPORT' },
    { code: 'SE', name: 'Support Engineer', team: 'SUPPORT' },
    { code: 'ONSITE', name: 'On-site Support', team: 'SUPPORT' },
    { code: 'DEV', name: 'Developer', team: 'DEV' },
    { code: 'SA', name: 'Solution Architect', team: 'DEV' }
  ];
  const REQ_TYPES = { PROJECT: 'Project', PRESALES: 'Pre-sales', OTHER: 'Other' };
  const STATUS = {
    DRAFT: 'Draft', PENDING_TL: 'Pending TL review', PENDING_DIR: 'Pending director approval',
    RETURNED: 'Returned for revision', APPROVED: 'Approved', REJECTED: 'Rejected', WITHDRAWN: 'Withdrawn'
  };

  // ---------- Date helpers ----------
  function parse(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function fmt(s) { if (!s) return '—'; const d = parse(s); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }
  function isWorking(d) { const w = d.getDay(); return w !== 0 && w !== 6 && !HOLIDAYS[iso(d)]; }
  // Working days strictly after the submission date and strictly before the planned start date.
  function noticeDays(submitted, start) {
    const days = []; let d = addDays(parse(submitted), 1); const end = parse(start); let n = 0; let guard = 0;
    while (d < end && guard < 400) {
      const k = iso(d); const w = d.getDay();
      const kind = (w === 0 || w === 6) ? 'x' : (HOLIDAYS[k] ? 'h' : 'w');
      if (kind === 'w') n++;
      days.push({ k: k, kind: kind });
      d = addDays(d, 1); guard++;
    }
    return { n: n, days: days };
  }
  function overlaps(a1, a2, b1, b2) { return a1 <= b2 && b1 <= a2; }

  // ---------- Sample requests ----------
  const SCOPE_SAMPLE = '• Configure the extraction script to limit processing to 100,000 records, based on the file list provided in the Excel source.\n• Enhance the extraction program, where necessary, to ingest and process the CSV output generated from the initial extraction step.\n• Coordinate with the ATFM team to securely transfer the required files for migration.\n• Perform reconciliation by tallying and validating the extracted and decrypted files.\nEstimated duration: 2–3 months';

      document.getElementById('route').innerHTML =
        '<div class="route-step"><span class="dot">1</span><div><div>' + (tl ? h(tl.name) : 'Team leader') + '</div><div class="hint">' + (tl ? h(tl.title) + ' · reviews and assigns engineers' : 'Set by the type of support') + '</div></div></div>' +
        '<div class="route-step"><span class="dot">2</span><div><div>' + h(USERS[DIRECTOR].name) + '</div><div class="hint">' + h(USERS[DIRECTOR].title) + ' · final approval</div></div></div>' +
        '<div class="hint">Each step sends an email automatically. You are copied on every decision.</div>';
    }
    f.addEventListener('input', update);
    f.addEventListener('change', e => { if (e.target.id === 'f-st') { pref.clear(); drawPref(); } update(); });
    f.addEventListener('click', e => {
      const p = e.target.closest('[data-pref]');
      if (p) { const id = p.dataset.pref; pref.has(id) ? pref.delete(id) : pref.add(id); drawPref(); }
      if (e.target.closest('[data-draft]')) { toast('Draft saved', 'Drafts are only visible to you until you submit.'); }
    });
    f.addEventListener('submit', e => {
      e.preventDefault();
      const val = id => f.querySelector(id).value.trim();
      const type = f.querySelector('input[name=type]:checked').value;
      const declared = f.querySelector('input[name=prio]:checked').value;
      const errs = [];
      const d = { type: type, project: val('#f-project'), wbs: val('#f-wbs'), client: val('#f-client'), supportType: val('#f-st'), headcount: parseInt(val('#f-hc'), 10), manDays: val('#f-md') === '' ? null : parseFloat(val('#f-md')), start: val('#f-start'), end: val('#f-end'), scope: val('#f-scope'), schedule: val('#f-sched'), justification: val('#f-just'), declared: declared };
      if (!d.project) errs.push('Enter the project or opportunity name.');
      if (!d.client) errs.push('Enter the client name.');
      if (!d.supportType) errs.push('Choose the type of support.');
      if (!(d.headcount >= 1)) errs.push('Enter how many engineers or developers you need (at least 1).');
      if (type === 'PROJECT' && !(d.manDays > 0)) errs.push('Enter the awarded man-days. This is required for project requests.');
      if (!d.start || !d.end) errs.push('Enter both the planned start and end dates.');
      else if (d.end < d.start) errs.push('The planned end date must be on or after the start date.');
      if (!d.scope) errs.push('Describe the scope of work.');
      if (!d.schedule) errs.push('Describe the task schedule and timing.');
      if (declared === 'URGENT' && !d.justification) errs.push('Explain why this request is urgent.');
      const fe = document.getElementById('formErr');
      if (errs.length) { fe.innerHTML = '<b>Please fix the following before submitting:</b><br>' + errs.map(h).join('<br>'); fe.hidden = false; fe.scrollIntoView({ block: 'center' }); return; }
      fe.hidden = true;
      state.formError = null;
      const nd = noticeDays(TODAY, d.start).n;
      const team = SUPPORT_TYPES.find(s => s.code === d.supportType).team;
      let req;
      if (r) {
        req = r; Object.assign(req, d); req.round += 1;
      } else {
        req = { id: 'ERR-2026-0' + (seq++), requester: state.user, alloc: [], history: [], round: 1 };
        Object.assign(req, d); requests.unshift(req);
      }
      req.team = team; req.preferred = Array.from(pref); req.submitted = TODAY; req.notice = nd;
      req.urgent = declared === 'URGENT' || nd < MIN_NOTICE; req.status = 'PENDING_TL'; req.stoppedAt = null;
      req.history.push({ at: TODAY + ' ' + nowTime(), who: state.user, action: r ? 'Resubmitted (round ' + req.round + ')' : 'Submitted', note: req.urgent ? 'Classified as urgent (' + nd + ' working days notice)' : nd + ' working days notice' });
      state.editingId = null; state.view = 'detail'; state.detailId = req.id;
      toast((r ? 'Resubmitted ' : 'Submitted ') + req.id, 'Email sent to ' + USERS[TEAMS[team].leader].name + (req.urgent ? ' with an [URGENT] subject.' : '.') + ' Switch to that role to continue.');
      render();
    });
    drawPref(); update();
  }
  function nowTime() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

  function stepper(r) {
    const steps = [['Submitted', USERS[r.requester].name], ['Team leader review', USERS[TEAMS[r.team].leader].name], ['Director approval', USERS[DIRECTOR].name], ['Resources confirmed', 'Requester and engineers notified']];
    const cur = { DRAFT: 0, PENDING_TL: 1, PENDING_DIR: 2, APPROVED: 4 }[r.status];
    return '<div class="stepper">' + steps.map((s, i) => {
      let cls = '', mk = '';
      if (r.stoppedAt != null && ['RETURNED', 'REJECTED', 'WITHDRAWN'].includes(r.status)) {
        if (i < r.stoppedAt) { cls = 'done'; mk = '✓'; } else if (i === r.stoppedAt) { cls = 'stopped'; mk = '!'; }
      } else if (cur != null) {
        if (i < cur || (cur === 4)) { cls = 'done'; mk = '✓'; } else if (i === cur) { cls = 'current'; }
      }
      const extra = cls === 'stopped' ? ' · ' + STATUS[r.status].toLowerCase() : cls === 'current' ? ' · waiting' : '';
      return '<div class="step ' + cls + '"><span class="mk">' + mk + '</span><div><div class="t">' + s[0] + '</div><div class="w">' + h(s[1]) + extra + '</div></div></div>';
    }).join('') + '</div>';
  }

  function vDetail() {
    const r = byId(state.detailId);
    if (!r) return '<div class="empty">Request not found.</div>';
    const u = me();
    const dl = [
      ['Request type', REQ_TYPES[r.type]],
      ['Priority', (r.urgent ? 'Urgent' : 'Normal') + (r.urgent ? (r.notice < MIN_NOTICE ? ' (short notice: ' + r.notice + ' working days)' : ' (declared by requester)') : ' (' + r.notice + ' working days notice)')],
      ['Project / opportunity', r.project], ['Project / WBS code', r.wbs || '—'], ['Client', r.client],
      ['Type of support', stName(r.supportType) + ' · ' + TEAMS[r.team].name], ['Engineers required', r.headcount],
      ['Preferred engineers', r.preferred.length ? r.preferred.map(id => eng(id).name).join(', ') : '—'],
      ['Man-days awarded', r.manDays == null ? 'Not applicable' : r.manDays],
      ['Planned period', fmt(r.start) + ' – ' + fmt(r.end)], ['Scope description', r.scope], ['Task schedule', r.schedule]
    ];
    if (r.urgent) dl.push(['Urgent justification', r.justification || '—']);
    const allocBlock = r.alloc.length ? '<section class="panel"><div class="panel-head"><h2>Allocated engineers</h2><span class="muted" style="font-size:12px">' + (r.alloc[0].status === 'CONFIRMED' ? 'Confirmed' : 'Proposed by team leader') + '</span></div><div class="kv">' + r.alloc.map(a => '<span>' + h(eng(a.eng).name) + ' <span class="muted">· ' + h(eng(a.eng).skill) + '</span></span><span>' + fmt(r.start) + ' – ' + fmt(r.end) + '</span>').join('') + '</div></section>' : '';
    return '<div class="pagehead"><div><div class="mono muted">' + r.id + ' · round ' + r.round + '</div><h1>' + h(r.project) + '</h1><p class="sub">Requested by ' + h(USERS[r.requester].name) + ' on ' + fmt(r.submitted) + '</p></div><div class="row-actions" style="align-items:center">' + (r.urgent ? '<span class="urgent">URGENT</span>' : '') + pill(r.status) + '</div></div>' +
      '<div class="detail"><div style="display:flex;flex-direction:column;gap:16px;min-width:0">' +
      actionPanel(r, u) +
      '<section class="panel"><h2>Request details</h2><dl class="dl">' + dl.map(x => '<dt>' + x[0] + '</dt><dd>' + h(x[1]) + '</dd>').join('') + '</dl></section>' +
      allocBlock +
      '</div><aside class="side"><section class="panel"><h2>Progress</h2>' + stepper(r) + '</section>' +
      '<section class="panel"><h2>History</h2><div class="timeline">' + r.history.slice().reverse().map(ev => '<div class="ev"><div><b>' + h(USERS[ev.who].name) + '</b> · ' + h(ev.action) + '</div><div class="meta">' + fmt(ev.at.slice(0, 10)) + ' ' + ev.at.slice(11) + (ev.note ? ' · ' + h(ev.note) : '') + '</div>' + (ev.comment ? '<div class="cmt">' + h(ev.comment) + '</div>' : '') + '</div>').join('') + '</div></section></aside></div>';
  }

  function actionPanel(r, u) {
    const err = state.actionError ? '<div class="error" role="alert">' + h(state.actionError) + '</div>' : '';
    if (u.role === 'TL' && r.status === 'PENDING_TL' && r.team === u.team) {
      const engs = ENGINEERS.filter(e => e.team === u.team);
      const sel = state.selectedAlloc || new Set(r.preferred.filter(id => engs.some(e => e.id === id)));
      state.selectedAlloc = sel;
      return '<section class="panel action"><div class="panel-head"><h2>Your review</h2><span class="muted" style="font-size:12px">Select ' + r.headcount + ' engineer' + (r.headcount > 1 ? 's' : '') + ' · ' + sel.size + ' selected</span></div>' +
        '<div class="alloc">' + engs.map(e => {
          const l = engLoad(e.id, r.start, r.end, r.id); const t = l.c + l.p;
          const cls = t >= 2 ? 'hi' : t === 1 ? 'mid' : 'lo';
          const txt = t === 0 ? 'Free in this period' : t + ' other assignment' + (t > 1 ? 's' : '') + (l.p ? ' (' + l.p + ' pending)' : '');
          return '<label><input type="checkbox" data-alloc="' + e.id + '"' + (sel.has(e.id) ? ' checked' : '') + '><span>' + h(e.name) + (r.preferred.includes(e.id) ? '<span class="tag">Preferred</span>' : '') + '<br><span class="muted" style="font-size:12px">' + h(e.skill) + '</span></span><span class="load ' + cls + '">' + txt + '</span></label>';
        }).join('') + '</div>' +
        '<div class="field action"><label for="a-cmt" style="font-weight:500;font-size:13px">Comment</label><textarea id="a-cmt" placeholder="Required when returning or rejecting, or when you assign fewer engineers than requested."></textarea></div>' + err +
        '<div class="row-actions"><button class="btn primary" data-act="tl-approve">Approve and send to director</button><button class="btn" data-act="return">Return to requester</button><button class="btn danger" data-act="reject">Reject</button></div></section>';
    }
    if (u.role === 'DIRECTOR' && r.status === 'PENDING_DIR') {
      return '<section class="panel action"><div class="panel-head"><h2>Your decision</h2><span class="muted" style="font-size:12px">Reviewed by ' + h(USERS[TEAMS[r.team].leader].name) + '</span></div>' +
        '<div class="field action"><label for="a-cmt" style="font-weight:500;font-size:13px">Comment</label><textarea id="a-cmt" placeholder="Required when returning or rejecting."></textarea></div>' + err +
        '<div class="row-actions"><button class="btn primary" data-act="dir-approve">Approve and confirm resources</button><button class="btn" data-act="return">Return to requester</button><button class="btn danger" data-act="reject">Reject</button></div></section>';
    }
    if (u.role === 'PM' && r.requester === state.user) {
      if (r.status === 'RETURNED') return '<section class="panel action"><h2>This request was returned to you</h2><p class="sub" style="margin:0">Read the comment in the history, update the request and resubmit it.</p><div class="row-actions"><button class="btn primary" data-act="revise">Revise and resubmit</button><button class="btn danger" data-act="withdraw-ask">Withdraw</button></div>' + withdrawConfirm() + '</section>';
      if (r.status === 'PENDING_TL' || r.status === 'PENDING_DIR') return '<section class="panel"><div class="panel-head"><h2>Waiting for ' + h(handler(r)) + '</h2><button class="btn danger" data-act="withdraw-ask">Withdraw request</button></div>' + withdrawConfirm() + '</section>';
    }
    return '';
  }
  function withdrawConfirm() {
    if (!state.confirmWithdraw) return '';
    return '<div class="confirm-box"><span>Withdraw this request? The reviewers will be told and any proposed engineers will be released. This cannot be undone.</span><div class="row-actions"><button class="btn danger" data-act="withdraw">Withdraw</button><button class="btn" data-act="withdraw-cancel">Keep request</button></div></div>';
  }

  function doAction(act) {
    const r = byId(state.detailId);
    const u = me();
    const cmtEl = document.getElementById('a-cmt');
    const cmt = cmtEl ? cmtEl.value.trim() : '';
    const stamp = TODAY + ' ' + nowTime();
    state.actionError = null;
    if (act === 'revise') { state.editingId = r.id; state.view = 'new'; state.formError = null; render(); return; }
    if (act === 'withdraw-ask') { state.confirmWithdraw = true; render(); return; }
    if (act === 'withdraw-cancel') { state.confirmWithdraw = false; render(); return; }
    if (act === 'withdraw') {
      state.confirmWithdraw = false; r.stoppedAt = r.status === 'PENDING_DIR' ? 2 : 1; r.status = 'WITHDRAWN'; r.alloc = [];
      r.history.push({ at: stamp, who: state.user, action: 'Withdrawn' });
      toast('Request withdrawn', 'The current approver has been notified.'); render(); return;
    }
    if ((act === 'return' || act === 'reject') && !cmt) { state.actionError = 'Add a comment so the requester knows what to change or why the request was declined.'; render(); return; }
    if (act === 'tl-approve') {
      const sel = state.selectedAlloc || new Set();
      if (!sel.size) { state.actionError = 'Assign at least one engineer before approving.'; render(); return; }
      if (sel.size < r.headcount && !cmt) { state.actionError = 'You assigned ' + sel.size + ' of ' + r.headcount + ' engineers. Add a comment explaining the shortfall.'; render(); return; }
      r.alloc = Array.from(sel).map(id => ({ eng: id, status: 'PROPOSED' }));
      r.status = 'PENDING_DIR';
      r.history.push({ at: stamp, who: state.user, action: 'Approved and proposed allocation', note: r.alloc.map(a => eng(a.eng).name).join(', '), comment: cmt });
      toast(r.id + ' sent to director', 'Email sent to ' + USERS[DIRECTOR].name + '. ' + USERS[r.requester].name + ' was copied.');
    } else if (act === 'dir-approve') {
      r.alloc.forEach(a => { a.status = 'CONFIRMED'; });
      r.status = 'APPROVED';
      r.history.push({ at: stamp, who: state.user, action: 'Approved', note: 'Allocation confirmed. Engineers notified.', comment: cmt });
      toast(r.id + ' approved', 'Confirmation sent to ' + USERS[r.requester].name + ' and ' + r.alloc.map(a => eng(a.eng).name).join(', ') + '.');
    } else if (act === 'return' || act === 'reject') {
      r.stoppedAt = r.status === 'PENDING_DIR' ? 2 : 1;
      r.status = act === 'return' ? 'RETURNED' : 'REJECTED';
      r.alloc = [];
      r.history.push({ at: stamp, who: state.user, action: act === 'return' ? 'Returned for revision' : 'Rejected', comment: cmt });
      toast(r.id + (act === 'return' ? ' returned' : ' rejected'), 'Email sent to ' + USERS[r.requester].name + '.');
    }
    state.selectedAlloc = null;
    render();
  }

  function vLoad() {
    const u = me();
    const engs = ENGINEERS.filter(e => u.role !== 'TL' || e.team === u.team);
    const weeks = []; let w = parse('2026-11-02');
    for (let i = 0; i < 10; i++) { weeks.push([iso(w), iso(addDays(w, 4))]); w = addDays(w, 7); }
    return '<div class="pagehead"><div><h1>Resource load</h1><p class="sub">Number of active assignments per engineer per week, including allocations still waiting for director approval.</p></div></div>' +
      '<div class="legend"><span><i style="background:color-mix(in srgb,var(--ok) 18%,transparent)"></i>1 assignment</span><span><i style="background:color-mix(in srgb,var(--warn) 28%,transparent)"></i>2 assignments</span><span><i style="background:color-mix(in srgb,var(--bad) 30%,transparent)"></i>3 or more</span><span><i style="background-image:repeating-linear-gradient(45deg,transparent 0 5px,color-mix(in srgb,var(--accent) 22%,transparent) 5px 7px)"></i>Includes pending approval</span></div>' +
      '<div class="tbl-wrap"><table class="heat"><thead><tr><th>Engineer</th>' + weeks.map(x => '<th>w/c ' + fmt(x[0]).replace(' 2026', '').replace(' 2027', '') + '</th>').join('') + '</tr></thead><tbody>' +
      engs.map(e => '<tr><td class="nowrap"><b>' + h(e.name) + '</b><div class="muted" style="font-size:12px">' + TEAMS[e.team].name + '</div></td>' + weeks.map(x => {
        const l = engLoad(e.id, x[0], x[1]); const t = l.c + l.p;
        const cls = t === 0 ? '' : t === 1 ? 'l1' : t === 2 ? 'l2' : 'l3';
        return '<td class="c ' + cls + (l.p ? ' p' : '') + '">' + (t || '') + '</td>';
      }).join('') + '</tr>').join('') + '</tbody></table></div>';
  }

  function vReports() {
    const months = [['Jun', 14, 3], ['Jul', 18, 4], ['Aug', 16, 6], ['Sep', 21, 5], ['Oct', 24, 9], ['Nov', requests.length, requests.filter(r => r.urgent).length]];
    const max = Math.max.apply(null, months.map(m => m[1]));
    const byType = SUPPORT_TYPES.map(s => [s.name, requests.filter(r => r.supportType === s.code).length]);
    const tmax = Math.max.apply(null, byType.map(b => b[1]).concat([1]));
    return '<div class="pagehead"><div><h1>Reports</h1><p class="sub">Sample figures. June to October are illustrative; November is calculated from the requests in this prototype.</p></div><button class="btn" data-export>Export to Excel</button></div>' +
      '<div class="tiles"><div class="tile"><span class="lbl">Requests this year</span><span class="num">' + (93 + requests.length) + '</span></div><div class="tile attn"><span class="lbl">Urgent share</span><span class="num">27%</span></div><div class="tile"><span class="lbl">Median TL decision</span><span class="num">1.4 <span style="font-size:14px" class="muted">wd</span></span></div><div class="tile"><span class="lbl">Median director decision</span><span class="num">0.8 <span style="font-size:14px" class="muted">wd</span></span></div></div>' +
      '<div class="grid2"><section class="panel"><h2>Requests per month</h2><div class="legend"><span><i style="background:var(--accent)"></i>Normal</span><span><i style="background:var(--bad)"></i>Urgent</span></div><div class="bars">' +
      months.map(m => '<div class="bar"><span>' + m[0] + ' 2026</span><span class="track"><span class="fill" style="width:' + ((m[1] - m[2]) / max * 100) + '%"></span><span class="fill u" style="width:' + (m[2] / max * 100) + '%"></span></span><span class="v">' + m[1] + '</span></div>').join('') + '</div></section>' +
      '<section class="panel"><h2>Current requests by support type</h2><div class="bars">' + byType.map(b => '<div class="bar"><span>' + b[0] + '</span><span class="track"><span class="fill" style="width:' + (b[1] / tmax * 100) + '%"></span></span><span class="v">' + b[1] + '</span></div>').join('') + '</div></section></div>';
  }

  function vAdmin() {
    return '<div class="pagehead"><div><h1>Settings</h1><p class="sub">Administrators maintain routing, the holiday calendar and workflow rules here. Changes apply to new submissions.</p></div></div>' +
      '<div class="grid2">' +
      '<section class="panel"><div class="panel-head"><h2>Type of support → team</h2><button class="btn">Add type</button></div><div class="kv">' + SUPPORT_TYPES.map(s => '<span>' + s.name + '</span><span>' + TEAMS[s.team].name + '</span>').join('') + '</div></section>' +
      '<section class="panel"><div class="panel-head"><h2>Approvers</h2><button class="btn">Edit</button></div><div class="kv">' + Object.keys(TEAMS).map(k => '<span>' + TEAMS[k].name + ' review</span><span>' + USERS[TEAMS[k].leader].name + '</span>').join('') + '<span>Final approval</span><span>' + USERS[DIRECTOR].name + '</span></div><p class="hint" style="margin:0">Approvers can name a delegate for leave periods.</p></section>' +
      '<section class="panel"><div class="panel-head"><h2>Workflow rules</h2><button class="btn">Edit</button></div><div class="kv"><span>Minimum notice</span><span>' + MIN_NOTICE + ' wd</span><span>Reminder for normal requests after</span><span>2 wd</span><span>Reminder for urgent requests after</span><span>4 h</span><span>Escalate to director after</span><span>4 wd</span><span>Request number format</span><span>ERR-YYYY-NNNN</span></div></section>' +
      '<section class="panel"><div class="panel-head"><h2>Public holidays</h2><button class="btn">Import year</button></div><div class="kv">' + Object.keys(HOLIDAYS).map(k => '<span>' + HOLIDAYS[k] + '</span><span>' + fmt(k) + '</span>').join('') + '</div></section>' +
      '<section class="panel"><div class="panel-head"><h2>Email delivery</h2><button class="btn">View queue</button></div><div class="kv"><span>Sent today</span><span>14</span><span>Waiting to retry</span><span>0</span><span>Failed</span><span>0</span></div></section>' +
      '<section class="panel"><div class="panel-head"><h2>Users and roles</h2><button class="btn">Manage</button></div><div class="kv">' + PERSONAS.map(k => '<span>' + USERS[k].name + '</span><span>' + USERS[k].role + '</span>').join('') + '</div></section>' +
      '</div>';
  }

  // ---------- Render ----------
  function render() {
    renderNav();
    const c = document.getElementById('content');
    const v = state.view;
    c.innerHTML = v === 'dashboard' ? vDashboard() : v === 'new' ? vForm() : v === 'list' ? vList() : v === 'inbox' ? vInbox() : v === 'detail' ? vDetail() : v === 'load' ? vLoad() : v === 'reports' ? vReports() : vAdmin();
    if (v === 'new') bindForm();
  }

  document.getElementById('persona').innerHTML = PERSONAS.map(k => '<option value="' + k + '">' + USERS[k].name + ' — ' + USERS[k].title + '</option>').join('');
  document.getElementById('persona').addEventListener('change', e => {
    state.user = e.target.value; state.selectedAlloc = null; state.actionError = null; state.confirmWithdraw = false; state.formError = null; state.editingId = null; state.filter = 'ALL';
    const r = me().role;
    if (state.view === 'detail') {
      const req = byId(state.detailId);
      const canSee = req && (r !== 'PM' || req.requester === state.user) && (r !== 'TL' || req.team === me().team);
      if (!canSee) state.view = r === 'ADMIN' ? 'admin' : 'dashboard';
    } else state.view = r === 'ADMIN' ? 'admin' : 'dashboard';
    render();
  });
  document.addEventListener('click', e => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { state.view = nav.dataset.nav; state.editingId = null; state.formError = null; state.actionError = null; render(); window.scrollTo(0, 0); return; }
    const open = e.target.closest('[data-open]');
    if (open) { state.view = 'detail'; state.detailId = open.dataset.open; state.selectedAlloc = null; state.actionError = null; state.confirmWithdraw = false; render(); window.scrollTo(0, 0); return; }
    const f = e.target.closest('[data-filter]');
    if (f) { state.filter = f.dataset.filter; render(); return; }
    const a = e.target.closest('[data-act]');
    if (a) { doAction(a.dataset.act); return; }
    if (e.target.closest('[data-export]')) { toast('Export', 'In the real system this downloads an Excel file of the filtered list.'); }
  });
  document.addEventListener('change', e => {
    const cb = e.target.closest('[data-alloc]');
    if (cb && state.selectedAlloc) { cb.checked ? state.selectedAlloc.add(cb.dataset.alloc) : state.selectedAlloc.delete(cb.dataset.alloc); const cmt = document.getElementById('a-cmt'); const keep = cmt ? cmt.value : ''; render(); const c2 = document.getElementById('a-cmt'); if (c2) c2.value = keep; }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const open = e.target.closest && e.target.closest('tr[data-open]'); if (open) open.click(); }
  });
  render();
})();
</script>
